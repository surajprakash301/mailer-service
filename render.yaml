# Free Render web service — pair with an external cron (cron-job.org)
# so jobs still run when the free instance is asleep.
services:
  - type: web
    name: loky-mailer
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: data
      - key: DISABLE_INTERNAL_CRON
        value: "true"
      - key: GATHER_INDUSTRIES
        value: "16"
      - key: GATHER_COMPANIES_PER_INDUSTRY
        value: "4"
      - key: GATHER_MIN_LEADS
        value: "5"
      - key: GATHER_MIN_SENDABLE
        value: "5"
      - key: SEND_MIN_EMAILS
        value: "5"
      - key: RE_ENGAGE_AFTER_DAYS
        value: "10"
      - key: MAX_EMAILS_PER_DAY
        value: "25"
      - key: EMAIL_ASSET_BASE_URL
        value: "https://mailer-service-dhq1.onrender.com"
      - key: APP_URL
        value: "https://mailer-service-dhq1.onrender.com"
      - key: DRY_RUN
        value: "true"
      - key: WHATSAPP_DRY_RUN
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_MODEL_FALLBACKS
        value: gemini-3.5-flash-lite,gemini-2.5-flash-lite,gemini-2.5-flash,gemini-1.5-flash-8b
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: REPLY_TO
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_LEADS_TABLE
        value: emailer-table

# Send cron: wake Render and dispatch ready/researched leads (09:45 IST = 04:15 UTC)
name: Send campaign via Render

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Trigger Render send campaign
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "Set repository secret APP_URL (e.g. https://loky-mailer.onrender.com)"
            exit 1
          fi
          # Wake cold instance
          curl -fsS -m 90 "${APP_URL}/api/health" >/dev/null || true
          sleep 8
          # Allow time to draft+send up to ~25 leads
          curl -fsS -m 600 -X POST "${APP_URL}/api/campaigns/run" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{}'

# Send cron: wake Render and dispatch ready leads (08:45 IST = 03:15 UTC)
name: Send campaign via Render

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Trigger Render send campaign
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL:-https://mailer-service-dhq1.onrender.com}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Set repository secret CRON_SECRET (same value as Render CRON_SECRET)"
            exit 1
          fi
          echo "Waking ${APP_URL} ..."
          for i in 1 2 3 4 5; do
            if curl -fsS -m 90 "${APP_URL}/api/health" >/tmp/health.json; then
              echo "Health OK (attempt $i)"
              cat /tmp/health.json
              break
            fi
            echo "Wake attempt $i failed; sleeping..."
            sleep 15
          done
          sleep 5
          echo "POST /api/campaigns/run"
          curl -fsS -m 600 -X POST "${APP_URL}/api/campaigns/run" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{}' | tee /tmp/send-report.json
          echo
          echo "Send finished."

# Morning gather: Gemini research → Supabase (07:00 IST = 01:30 UTC)
# Target: ~25 leads across ~10 industries for the morning send.
name: Gather leads to Supabase

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-insights.txt

      - name: Install dependencies
        run: pip install -r requirements-insights.txt

      - name: Research leads and upsert to Supabase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_LEADS_TABLE: emailer-table
          GEMINI_MODEL: gemini-3.6-flash
          GATHER_INDUSTRIES: "10"
          GATHER_COMPANIES_PER_INDUSTRY: "3"
          GATHER_MAX_LEADS: "25"
        run: python scripts/main.py

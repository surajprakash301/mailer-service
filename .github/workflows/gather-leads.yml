# Morning gather: Gemini research → Supabase emailer_table (07:00 IST = 01:30 UTC)
name: Gather leads to Supabase

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-insights.txt

      - name: Install dependencies
        run: pip install -r requirements-insights.txt

      - name: Research leads and upsert to Supabase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_LEADS_TABLE: ${{ vars.SUPABASE_LEADS_TABLE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/main.py
